name: doc_generator
version: 0.1.0
description: Generate structured legal and compliance Markdown documents from templates and JSON payloads
category: templates
status: beta
triggers:
  - cli
  - webhook:doc
permissions:
  - docs:write
  - llm:invoke
inputs:
  - name: template
    type: string
    required: false
    description: Built-in template name (board_resolution, offer_letter, compliance_filing) or custom template identifier
    default: board_resolution
  - name: json
    type: path
    required: false
    description: Path to a JSON file (or inline dict) containing template name and placeholder field values
config_files: []
estimated_time_saved_minutes: 35
entrypoint: agent:create_agent
