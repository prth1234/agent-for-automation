<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 228" width="900" height="228">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", sans-serif; }
.mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
.fg { fill: #e6edf3; }
.mut { fill: #8b949e; }
.ac { fill: #8ea2ff; }
.ok { fill: #34d399; }
.bd { fill: none; stroke: rgba(255,255,255,0.16); stroke-width: 1.2; }
.sep { stroke: rgba(255,255,255,0.14); stroke-width: 1; }
.bar-bg { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 2; }
.bar-fg { fill: none; stroke: #22d3ee; stroke-width: 2.5; stroke-linecap: round; animation: wk-prog 18s linear infinite; }
@keyframes wk-prog { 0% { stroke-dasharray: 0 880; } 16.6% { stroke-dasharray: 146 880; } 33.3% { stroke-dasharray: 293 880; } 50% { stroke-dasharray: 440 880; } 66.6% { stroke-dasharray: 586 880; } 83.3% { stroke-dasharray: 733 880; } 100% { stroke-dasharray: 880 880; } }
.nb0 { animation: wk-b0 18s infinite; }
.np0 { animation: wk-p0 18s infinite; }
@keyframes wk-b0 { 0%, 15.2% { stroke: #8ea2ff; stroke-width: 1.8; } 16.7%, 100% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } }
@keyframes wk-p0 { 0%, 15.2% { opacity: 1; } 16.7%, 100% { opacity: 0; } }
.nb1 { animation: wk-b1 18s infinite; }
.np1 { opacity: 0; animation: wk-p1 18s infinite; }
@keyframes wk-b1 { 0%, 16.7% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } 18.2%, 31.8% { stroke: #8ea2ff; stroke-width: 1.8; } 33.3%, 100% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } }
@keyframes wk-p1 { 0%, 16.7% { opacity: 0; } 18.2%, 31.8% { opacity: 1; } 33.3%, 100% { opacity: 0; } }
.nb2 { animation: wk-b2 18s infinite; }
.np2 { opacity: 0; animation: wk-p2 18s infinite; }
@keyframes wk-b2 { 0%, 33.3% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } 34.8%, 48.5% { stroke: #8ea2ff; stroke-width: 1.8; } 50.0%, 100% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } }
@keyframes wk-p2 { 0%, 33.3% { opacity: 0; } 34.8%, 48.5% { opacity: 1; } 50.0%, 100% { opacity: 0; } }
.nb3 { animation: wk-b3 18s infinite; }
.np3 { opacity: 0; animation: wk-p3 18s infinite; }
@keyframes wk-b3 { 0%, 50.0% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } 51.5%, 65.2% { stroke: #8ea2ff; stroke-width: 1.8; } 66.7%, 100% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } }
@keyframes wk-p3 { 0%, 50.0% { opacity: 0; } 51.5%, 65.2% { opacity: 1; } 66.7%, 100% { opacity: 0; } }
.nb4 { animation: wk-b4 18s infinite; }
.np4 { opacity: 0; animation: wk-p4 18s infinite; }
@keyframes wk-b4 { 0%, 66.7% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } 68.2%, 81.8% { stroke: #8ea2ff; stroke-width: 1.8; } 83.3%, 100% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } }
@keyframes wk-p4 { 0%, 66.7% { opacity: 0; } 68.2%, 81.8% { opacity: 1; } 83.3%, 100% { opacity: 0; } }
.nb5 { animation: wk-b5 18s infinite; }
.np5 { opacity: 0; animation: wk-p5 18s infinite; }
@keyframes wk-b5 { 0%, 83.3% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } 84.8%, 98.5% { stroke: #8ea2ff; stroke-width: 1.8; } 100.0%, 100% { stroke: rgba(255,255,255,0.16); stroke-width: 1.2; } }
@keyframes wk-p5 { 0%, 83.3% { opacity: 0; } 84.8%, 98.5% { opacity: 1; } 100.0%, 100% { opacity: 0; } }

@media (prefers-color-scheme: light) {
  .fg { fill: #1f2328; }
  .mut { fill: #59636e; }
  .ac { fill: #4f46e5; }
  .ok { fill: #059669; }
  .bd { stroke: rgba(0,0,0,0.16); }
  .sep { stroke: rgba(0,0,0,0.14); }
  .bar-bg { stroke: rgba(0,0,0,0.14); }
  .bar-fg { stroke: #0891b2; }
}
@media (prefers-reduced-motion: reduce) {
  .bar-fg { animation: none; stroke-dasharray: 146 880; }
  .nb0, .nb1, .nb2, .nb3, .nb4, .nb5 { animation: none; }
  .np0 { animation: none; opacity: 1; }
  .np1, .np2, .np3, .np4, .np5 { animation: none; opacity: 0; }
}

  </style>
  <rect x="10" y="8" width="138" height="58" rx="14" class="bd nb0"/><text x="24" y="28" font-size="12.5" class="mut">Step 1</text><text x="24" y="50" font-size="15" font-weight="600" class="fg">Webhook</text><rect x="158" y="8" width="138" height="58" rx="14" class="bd nb1"/><text x="172" y="28" font-size="12.5" class="mut">Step 2</text><text x="172" y="50" font-size="15" font-weight="600" class="fg">Registry</text><rect x="306" y="8" width="138" height="58" rx="14" class="bd nb2"/><text x="320" y="28" font-size="12.5" class="mut">Step 3</text><text x="320" y="50" font-size="15" font-weight="600" class="fg">Classify</text><rect x="454" y="8" width="138" height="58" rx="14" class="bd nb3"/><text x="468" y="28" font-size="12.5" class="mut">Step 4</text><text x="468" y="50" font-size="15" font-weight="600" class="fg">Handle</text><rect x="602" y="8" width="138" height="58" rx="14" class="bd nb4"/><text x="616" y="28" font-size="12.5" class="mut">Step 5</text><text x="616" y="50" font-size="15" font-weight="600" class="fg">Notify</text><rect x="750" y="8" width="138" height="58" rx="14" class="bd nb5"/><text x="764" y="28" font-size="12.5" class="mut">Step 6</text><text x="764" y="50" font-size="15" font-weight="600" class="fg">Record</text>
  <line x1="10" y1="82" x2="890" y2="82" class="bar-bg"/>
  <line x1="10" y1="82" x2="890" y2="82" class="bar-fg"/>
  <rect x="10" y="96" width="880" height="122" rx="18" class="bd"/>
  <line x1="410" y1="96" x2="410" y2="218" class="sep"/>
  <g class="np0"><text x="32" y="132" font-size="19" font-weight="600" class="fg">Jira sends the ticket</text><text x="32" y="160" font-size="13.5" class="mut">A new SQ ticket reaches the AFA server through</text><text x="32" y="180" font-size="13.5" class="mut">the Jira webhook.</text><text x="435" y="134" font-size="13" class="mono ac">POST /webhooks/jira</text><text x="435" y="158" font-size="13" class="mono fg">{ "issue": { "key": "SQ-123" } }</text><text x="435" y="182" font-size="13" class="mono ok"></text></g><g class="np1"><text x="32" y="132" font-size="19" font-weight="600" class="fg">AFA finds the agent</text><text x="32" y="160" font-size="13.5" class="mut">The registry scans each agent.yaml and loads</text><text x="32" y="180" font-size="13.5" class="mut">the matching agent.</text><text x="435" y="134" font-size="13" class="mono ac">registry.resolve("support_ticket")</text><text x="435" y="158" font-size="13" class="mono fg">-> agents/support_ticket/agent.yaml</text><text x="435" y="182" font-size="13" class="mono ok"></text></g><g class="np2"><text x="32" y="132" font-size="19" font-weight="600" class="fg">The LLM labels it</text><text x="32" y="160" font-size="13.5" class="mut">The classifier picks a label so the right</text><text x="32" y="180" font-size="13.5" class="mut">handler runs.</text><text x="435" y="134" font-size="13" class="mono ac">label: genie_onboarding</text><text x="435" y="158" font-size="13" class="mono fg">others: bug_investigation, unknown</text><text x="435" y="182" font-size="13" class="mono ok"></text></g><g class="np3"><text x="32" y="132" font-size="19" font-weight="600" class="fg">Change code, open PR</text><text x="32" y="160" font-size="13.5" class="mut">Finds the repo in config/repos.yaml, edits it</text><text x="32" y="180" font-size="13.5" class="mut">and opens a pull request.</text><text x="435" y="134" font-size="13" class="mono ac">repo: from config/repos.yaml</text><text x="435" y="158" font-size="13" class="mono fg">add org 4821 to Terraform</text><text x="435" y="182" font-size="13" class="mono ok">open pull request</text></g><g class="np4"><text x="32" y="132" font-size="19" font-weight="600" class="fg">Jira and email updated</text><text x="32" y="160" font-size="13.5" class="mut">Jira gets the pull request link and the team</text><text x="32" y="180" font-size="13.5" class="mut">is notified.</text><text x="435" y="134" font-size="13" class="mono ac">Jira comment: pull request link</text><text x="435" y="158" font-size="13" class="mono fg">email: team notified</text><text x="435" y="182" font-size="13" class="mono ok"></text></g><g class="np5"><text x="32" y="132" font-size="19" font-weight="600" class="fg">State saved, human reviews</text><text x="32" y="160" font-size="13.5" class="mut">Ticket state is stored so it never runs twice.</text><text x="32" y="180" font-size="13.5" class="mut">A person reviews the PR.</text><text x="435" y="134" font-size="13" class="mono ac">SQ-123 stored -> skipped next time</text><text x="435" y="158" font-size="13" class="mono fg">pull request waits for review</text><text x="435" y="182" font-size="13" class="mono ok"></text></g>
</svg>
