<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".4" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aab6ff"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="170" rx="28"/></clipPath>

</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.w1{animation:d1 12s ease-in-out infinite alternate}.w2{animation:d2 15s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(220px,0)}}@keyframes d2{to{transform:translate(-220px,0)}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="170" fill="#06070b"/>
<g filter="url(#blur)"><circle class="w1" cx="300" cy="150" r="110" fill="#5b5bf0" opacity=".55"/><circle class="w2" cx="900" cy="150" r="110" fill="#06b6d4" opacity=".45"/></g>
<text x="600" y="78" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="-1.2" fill="url(#ttl)">Build once. Reuse everywhere.</text>
<text x="600" y="112" text-anchor="middle" font-size="16" fill="#9aa3b8">Add an agent, and the whole team can use it.</text>
<rect x=".5" y=".5" width="1199" height="169" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>