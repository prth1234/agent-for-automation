<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 126" width="900" height="126" role="img" xmlns:c2pa="http://c2pa.org/manifest"><defs>
<filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="tglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
<linearGradient id="ttl" x1="0" x2="1"><stop class="g1" offset="0"/><stop class="g2" offset=".6"/><stop class="g3" offset="1"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#8ea2ff" stop-opacity="0"/><stop offset=".5" stop-color="#8ea2ff"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
.fg{fill:#f0f3ff} .mut{fill:#8b94aa} .dim{fill:#6b7488}
.bd{fill:none;stroke:#fff;stroke-opacity:.2;stroke-width:1.2}
.ln{stroke:#fff;stroke-opacity:.14}
.g1{stop-color:#ffffff} .g2{stop-color:#9aa8ff} .g3{stop-color:#67e8f9}
@media (prefers-color-scheme:light){
 .fg{fill:#1f2328} .mut{fill:#59636e} .dim{fill:#818b98}
 .bd{stroke:#000;stroke-opacity:.2} .ln{stroke:#000;stroke-opacity:.16}
 .g1{stop-color:#1f2328} .g2{stop-color:#4f46e5} .g3{stop-color:#0891b2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.dash{stroke-dasharray:5 7;animation:fl 1.2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
.pulse{animation:pl 4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:.8}}
.sw{animation:sw 6s ease-in-out infinite}@keyframes sw{0%,100%{opacity:.25}50%{opacity:1}}</style><rect x="200" y="14" width="500" height="2" fill="url(#edge)" class="sw"/>
