<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 124" width="900" height="124" role="img" aria-label="Build once. Reuse everywhere.">
  <defs>
    <linearGradient id="afa-ft-ttl" x1="0" x2="1">
      <stop class="g1" offset="0"/>
      <stop class="g2" offset="0.5"/>
      <stop class="g3" offset="0.8"/>
      <stop class="g4" offset="1"/>
    </linearGradient>
    <linearGradient id="afa-ft-rule" x1="0" x2="1">
      <stop class="g2" offset="0" stop-opacity="0"/>
      <stop class="g2" offset="0.35"/>
      <stop class="g3" offset="0.65"/>
      <stop class="g4" offset="1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .fg { fill: #F1F5F9; }
  .mut { fill: #94A3B8; }
  .cyan { fill: #22D3EE; }
  .g1 { stop-color: #F1F5F9; }
  .g2 { stop-color: #818CF8; }
  .g3 { stop-color: #22D3EE; }
  .g4 { stop-color: #34D399; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .cyan { fill: #0891B2; }
    .g1 { stop-color: #0F172A; }
    .g2 { stop-color: #6366F1; }
    .g3 { stop-color: #06B6D4; }
    .g4 { stop-color: #10B981; }
  }

  .trace { stroke-dasharray: 8 7; animation: afa-ft-tr 2.5s linear infinite; }
  @keyframes afa-ft-tr { to { stroke-dashoffset: -30; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <path id="afa-ft-path" d="M 200 18 L 700 18" fill="none" stroke="url(#afa-ft-rule)" class="trace" stroke-width="2" stroke-linecap="round"/>
  <circle r="4" class="cyan">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#afa-ft-path"/>
    </animateMotion>
  </circle>
  <text x="450" y="74" text-anchor="middle" font-size="36" font-weight="700" letter-spacing="-1.2" fill="url(#afa-ft-ttl)">Build once. Reuse everywhere.</text>
  <text x="450" y="104" text-anchor="middle" font-size="15" class="mut">Add an agent, and the whole team can use it.</text>
</svg>
