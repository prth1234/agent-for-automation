<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" width="900" height="326" role="img" aria-label="Agent marketplace">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
  .fg { fill: #F1F5F9; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #94A3B8; stroke-opacity: 0.28; stroke-width: 1.25; }
  .ln { stroke: #94A3B8; stroke-opacity: 0.22; }
  .indigo { fill: #818CF8; }
  .indigo-s { stroke: #818CF8; }
  .cyan { fill: #22D3EE; }
  .cyan-s { stroke: #22D3EE; }
  .emerald { fill: #34D399; }
  .emerald-s { stroke: #34D399; }
  .g1 { stop-color: #F1F5F9; }
  .g2 { stop-color: #818CF8; }
  .g3 { stop-color: #22D3EE; }
  .g4 { stop-color: #34D399; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .bd { stroke: #0F172A; stroke-opacity: 0.18; }
    .ln { stroke: #0F172A; stroke-opacity: 0.18; }
    .indigo { fill: #4F46E5; }
    .indigo-s { stroke: #4F46E5; }
    .cyan { fill: #0891B2; }
    .cyan-s { stroke: #0891B2; }
    .emerald { fill: #059669; }
    .emerald-s { stroke: #059669; }
    .g1 { stop-color: #0F172A; }
    .g2 { stop-color: #6366F1; }
    .g3 { stop-color: #06B6D4; }
    .g4 { stop-color: #10B981; }
  }
  
  .pulse { animation: afa-pl 3.5s ease-in-out infinite; }
  @keyframes afa-pl { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <!-- Row 1 -->
  <rect x="2" y="10" width="284" height="142" rx="12" fill="none" class="emerald-s pulse" stroke-width="1.5"/>
  <text class="m fg" x="22" y="44" font-size="16" font-weight="600">support_ticket</text>
  <text x="22" y="72" font-size="13" class="mut">Triage Jira tickets, open PRs for</text>
  <text x="22" y="90" font-size="13" class="mut">fixes and onboarding.</text>
  <rect x="22" y="110" width="68" height="24" rx="12" fill="none" class="emerald-s" stroke-width="1.2"/>
  <text x="56" y="126.5" text-anchor="middle" font-size="12.5" font-weight="600" class="emerald">stable</text>
  <text class="m mut" x="266" y="126.5" text-anchor="end" font-size="12.5">afa run support_ticket</text>

  <rect x="308" y="10" width="284" height="142" rx="12" fill="none" class="cyan-s pulse" stroke-width="1.5"/>
  <text class="m fg" x="328" y="44" font-size="16" font-weight="600">weekly_digest</text>
  <text x="328" y="72" font-size="13" class="mut">Summarise tickets, PRs and metrics</text>
  <text x="328" y="90" font-size="13" class="mut">into a weekly digest.</text>
  <rect x="328" y="110" width="56" height="24" rx="12" fill="none" class="cyan-s" stroke-width="1.2"/>
  <text x="356" y="126.5" text-anchor="middle" font-size="12.5" font-weight="600" class="cyan">beta</text>
  <text class="m mut" x="572" y="126.5" text-anchor="end" font-size="12.5">afa run weekly_digest</text>

  <rect x="614" y="10" width="284" height="142" rx="12" class="bd"/>
  <text class="m mut" x="634" y="44" font-size="16" font-weight="600">invoice_extraction</text>
  <text x="634" y="72" font-size="13" class="mut">Read PDFs, validate fields, push</text>
  <text x="634" y="90" font-size="13" class="mut">results to accounting.</text>
  <rect x="634" y="110" width="78" height="24" rx="12" class="bd"/>
  <text x="673" y="126.5" text-anchor="middle" font-size="12.5" font-weight="600" class="mut">planned</text>

  <!-- Row 2 -->
  <rect x="2" y="172" width="284" height="142" rx="12" class="bd"/>
  <text class="m mut" x="22" y="206" font-size="16" font-weight="600">doc_generator</text>
  <text x="22" y="234" font-size="13" class="mut">Draft resolutions, letters and</text>
  <text x="22" y="252" font-size="13" class="mut">filings from templates.</text>
  <rect x="22" y="272" width="78" height="24" rx="12" class="bd"/>
  <text x="61" y="288.5" text-anchor="middle" font-size="12.5" font-weight="600" class="mut">planned</text>

  <rect x="308" y="172" width="284" height="142" rx="12" class="bd"/>
  <text class="m mut" x="328" y="206" font-size="16" font-weight="600">compliance_check</text>
  <text x="328" y="234" font-size="13" class="mut">Flag missing or inconsistent</text>
  <text x="328" y="252" font-size="13" class="mut">documents before review.</text>
  <rect x="328" y="272" width="78" height="24" rx="12" class="bd"/>
  <text x="367" y="288.5" text-anchor="middle" font-size="12.5" font-weight="600" class="mut">planned</text>

  <rect x="614" y="172" width="284" height="142" rx="12" class="bd"/>
  <text class="m mut" x="634" y="206" font-size="16" font-weight="600">slack_qa</text>
  <text x="634" y="234" font-size="13" class="mut">Answer staff questions from SOPs,</text>
  <text x="634" y="252" font-size="13" class="mut">with sources.</text>
  <rect x="634" y="272" width="78" height="24" rx="12" class="bd"/>
  <text x="673" y="288.5" text-anchor="middle" font-size="12.5" font-weight="600" class="mut">planned</text>
</svg>
