<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" width="900" height="326" role="img" aria-label="Agent marketplace">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
  .fg { fill: #F1F5F9; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #94A3B8; stroke-opacity: 0.25; stroke-width: 1.25; }
  .indigo { fill: #818CF8; }
  .indigo-s { stroke: #818CF8; }
  .cyan { fill: #22D3EE; }
  .cyan-s { stroke: #22D3EE; }
  .emerald { fill: #34D399; }
  .emerald-s { stroke: #34D399; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .bd { stroke: #0F172A; stroke-opacity: 0.18; }
    .indigo { fill: #4F46E5; }
    .indigo-s { stroke: #4F46E5; }
    .cyan { fill: #0891B2; }
    .cyan-s { stroke: #0891B2; }
    .emerald { fill: #059669; }
    .emerald-s { stroke: #059669; }
  }

  .pulse { animation: afa-mk-pl 4s ease-in-out infinite; }
  @keyframes afa-mk-pl {
    0%, 100% { stroke-opacity: 0.4; stroke-width: 1.4; }
    50% { stroke-opacity: 1; stroke-width: 2.1; }
  }
  .dot-live { animation: afa-mk-dl 2s ease-in-out infinite; }
  @keyframes afa-mk-dl { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  <!-- Row 1 -->
  <rect x="2" y="10" width="284" height="142" rx="12" fill="none" class="emerald-s pulse" style="animation-delay:0s"/>
  <circle cx="264" cy="36" r="4" class="emerald dot-live"/>
  <text class="m fg" x="22" y="44" font-size="16" font-weight="600">support_ticket</text>
  <text x="22" y="72" font-size="13" class="mut">Triage Jira tickets, open PRs for</text>
  <text x="22" y="90" font-size="13" class="mut">fixes and onboarding.</text>
  <rect x="22" y="110" width="84" height="24" rx="12" fill="none" class="emerald-s" stroke-width="1.2"/>
  <text x="64" y="126" text-anchor="middle" font-size="11.5" font-weight="600" class="emerald">engineering</text>
  <text class="m mut" x="116" y="126" font-size="12">~30m saved / run</text>

  <rect x="308" y="10" width="284" height="142" rx="12" fill="none" class="cyan-s pulse" style="animation-delay:0.6s"/>
  <circle cx="570" cy="36" r="4" class="cyan dot-live" style="animation-delay:0.6s"/>
  <text class="m fg" x="328" y="44" font-size="16" font-weight="600">weekly_digest</text>
  <text x="328" y="72" font-size="13" class="mut">Summarise tickets, PRs and metrics</text>
  <text x="328" y="90" font-size="13" class="mut">into a weekly digest.</text>
  <rect x="328" y="110" width="76" height="24" rx="12" fill="none" class="cyan-s" stroke-width="1.2"/>
  <text x="366" y="126" text-anchor="middle" font-size="11.5" font-weight="600" class="cyan">reporting</text>
  <text class="m mut" x="414" y="126" font-size="12">~20m saved / run</text>

  <rect x="614" y="10" width="284" height="142" rx="12" fill="none" class="indigo-s pulse" style="animation-delay:1.2s"/>
  <circle cx="876" cy="36" r="4" class="indigo dot-live" style="animation-delay:1.2s"/>
  <text class="m fg" x="634" y="44" font-size="16" font-weight="600">invoice_extraction</text>
  <text x="634" y="72" font-size="13" class="mut">Extract and validate invoice fields</text>
  <text x="634" y="90" font-size="13" class="mut">into accounting payloads.</text>
  <rect x="634" y="110" width="66" height="24" rx="12" fill="none" class="indigo-s" stroke-width="1.2"/>
  <text x="667" y="126" text-anchor="middle" font-size="11.5" font-weight="600" class="indigo">parsing</text>
  <text class="m mut" x="710" y="126" font-size="12">~25m saved / run</text>

  <!-- Row 2 -->
  <rect x="2" y="174" width="284" height="142" rx="12" fill="none" class="cyan-s pulse" style="animation-delay:1.8s"/>
  <circle cx="264" cy="200" r="4" class="cyan dot-live" style="animation-delay:1.8s"/>
  <text class="m fg" x="22" y="208" font-size="16" font-weight="600">doc_generator</text>
  <text x="22" y="236" font-size="13" class="mut">Draft resolutions, letters and</text>
  <text x="22" y="254" font-size="13" class="mut">filings from templates.</text>
  <rect x="22" y="274" width="78" height="24" rx="12" fill="none" class="cyan-s" stroke-width="1.2"/>
  <text x="61" y="290" text-anchor="middle" font-size="11.5" font-weight="600" class="cyan">templates</text>
  <text class="m mut" x="110" y="290" font-size="12">~35m saved / run</text>

  <rect x="308" y="174" width="284" height="142" rx="12" fill="none" class="indigo-s pulse" style="animation-delay:2.4s"/>
  <circle cx="570" cy="200" r="4" class="indigo dot-live" style="animation-delay:2.4s"/>
  <text class="m fg" x="328" y="208" font-size="16" font-weight="600">compliance_check</text>
  <text x="328" y="236" font-size="13" class="mut">Flag missing, expired or</text>
  <text x="328" y="254" font-size="13" class="mut">inconsistent documents.</text>
  <rect x="328" y="274" width="84" height="24" rx="12" fill="none" class="indigo-s" stroke-width="1.2"/>
  <text x="370" y="290" text-anchor="middle" font-size="11.5" font-weight="600" class="indigo">validation</text>
  <text class="m mut" x="422" y="290" font-size="12">~30m saved / run</text>

  <rect x="614" y="174" width="284" height="142" rx="12" fill="none" class="emerald-s pulse" style="animation-delay:3.0s"/>
  <circle cx="876" cy="200" r="4" class="emerald dot-live" style="animation-delay:3.0s"/>
  <text class="m fg" x="634" y="208" font-size="16" font-weight="600">slack_qa</text>
  <text x="634" y="236" font-size="13" class="mut">Answer staff questions from SOPs,</text>
  <text x="634" y="254" font-size="13" class="mut">with exact source citations.</text>
  <rect x="634" y="274" width="68" height="24" rx="12" fill="none" class="emerald-s" stroke-width="1.2"/>
  <text x="668" y="290" text-anchor="middle" font-size="11.5" font-weight="600" class="emerald">chatops</text>
  <text class="m mut" x="712" y="290" font-size="12">~10m saved / run</text>
</svg>
