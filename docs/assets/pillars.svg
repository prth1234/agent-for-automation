<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" width="900" height="196" role="img" aria-label="Core pillars">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
  .fg { fill: #F1F5F9; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #94A3B8; stroke-opacity: 0.25; stroke-width: 1.25; }
  .indigo { fill: #818CF8; }
  .indigo-s { stroke: #818CF8; }
  .cyan { fill: #22D3EE; }
  .cyan-s { stroke: #22D3EE; }
  .emerald { fill: #34D399; }
  .emerald-s { stroke: #34D399; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .bd { stroke: #0F172A; stroke-opacity: 0.18; }
    .indigo { fill: #4F46E5; }
    .indigo-s { stroke: #4F46E5; }
    .cyan { fill: #0891B2; }
    .cyan-s { stroke: #0891B2; }
    .emerald { fill: #059669; }
    .emerald-s { stroke: #059669; }
  }

  .card { animation: afa-pl-card 6s ease-in-out infinite; }
  @keyframes afa-pl-card {
    0%, 100% { stroke-opacity: 0.3; stroke-width: 1.3; }
    15% { stroke-opacity: 1; stroke-width: 2.2; }
    32% { stroke-opacity: 0.3; stroke-width: 1.3; }
  }

  .ic { stroke-dasharray: 80; stroke-dashoffset: 80; animation: afa-pl-ic 6s ease-in-out infinite; }
  @keyframes afa-pl-ic {
    0% { stroke-dashoffset: 80; }
    20%, 85% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 80; }
  }

  .bar { stroke-dasharray: 166; stroke-dashoffset: 166; animation: afa-pl-bar 6s ease-in-out infinite; }
  @keyframes afa-pl-bar {
    0% { stroke-dashoffset: 166; }
    22%, 85% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 166; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .ic, .bar { stroke-dashoffset: 0 !important; }
  }
</style>

  <!-- Card 1: Modular -->
  <rect x="2" y="12" width="206" height="172" rx="12" fill="none" class="indigo-s card" style="animation-delay:0s"/>
  <rect x="24" y="32" width="13" height="13" rx="3" fill="none" class="indigo-s ic" stroke-width="1.8" style="animation-delay:0s"/>
  <rect x="42" y="32" width="13" height="13" rx="3" fill="none" class="indigo-s ic" stroke-width="1.8" style="animation-delay:0.15s"/>
  <rect x="24" y="50" width="13" height="13" rx="3" fill="none" class="indigo-s ic" stroke-width="1.8" style="animation-delay:0.3s"/>
  <rect x="42" y="50" width="13" height="13" rx="3" fill="none" class="indigo-s ic" stroke-width="1.8" style="animation-delay:0.45s"/>
  <text x="24" y="96" font-size="18.5" font-weight="600" letter-spacing="-0.3" class="fg">Modular</text>
  <text x="24" y="120" font-size="13" class="mut">One folder per use case.</text>
  <text x="24" y="139" font-size="13" class="mut">Drop in, auto discovered.</text>
  <line x1="24" y1="166" x2="190" y2="166" class="bd"/>
  <line x1="24" y1="166" x2="190" y2="166" class="indigo-s bar" stroke-width="2" stroke-linecap="round" style="animation-delay:0s"/>

  <!-- Card 2: Config-driven -->
  <rect x="232" y="12" width="206" height="172" rx="12" fill="none" class="cyan-s card" style="animation-delay:1.5s"/>
  <path d="M254 38H286M254 48H286M254 58H286" fill="none" class="cyan-s ic" stroke-width="1.8" stroke-linecap="round" style="animation-delay:1.5s"/>
  <circle cx="277" cy="38" r="3.5" fill="none" class="cyan-s ic" stroke-width="1.8" style="animation-delay:1.65s"/>
  <circle cx="263" cy="48" r="3.5" fill="none" class="cyan-s ic" stroke-width="1.8" style="animation-delay:1.8s"/>
  <circle cx="278" cy="58" r="3.5" fill="none" class="cyan-s ic" stroke-width="1.8" style="animation-delay:1.95s"/>
  <text x="254" y="96" font-size="18.5" font-weight="600" letter-spacing="-0.3" class="fg">Config-driven</text>
  <text x="254" y="120" font-size="13" class="mut">Rules live in YAML.</text>
  <text x="254" y="139" font-size="13" class="mut">Teams tune it, no code.</text>
  <line x1="254" y1="166" x2="420" y2="166" class="bd"/>
  <line x1="254" y1="166" x2="420" y2="166" class="cyan-s bar" stroke-width="2" stroke-linecap="round" style="animation-delay:1.5s"/>

  <!-- Card 3: Safe -->
  <rect x="462" y="12" width="206" height="172" rx="12" fill="none" class="emerald-s card" style="animation-delay:3s"/>
  <path d="M500 32L514 38V48C514 57 507 62 500 66C493 62 486 57 486 48V38Z" fill="none" class="emerald-s ic" stroke-width="1.8" stroke-linejoin="round" style="animation-delay:3s"/>
  <path d="M494 49L499 54L507 44" fill="none" class="emerald-s ic" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:3.25s"/>
  <text x="484" y="96" font-size="18.5" font-weight="600" letter-spacing="-0.3" class="fg">Safe</text>
  <text x="484" y="120" font-size="13" class="mut">Humans approve changes.</text>
  <text x="484" y="139" font-size="13" class="mut">Least-privilege access.</text>
  <line x1="484" y1="166" x2="650" y2="166" class="bd"/>
  <line x1="484" y1="166" x2="650" y2="166" class="emerald-s bar" stroke-width="2" stroke-linecap="round" style="animation-delay:3s"/>

  <!-- Card 4: Measurable -->
  <rect x="692" y="12" width="206" height="172" rx="12" fill="none" class="indigo-s card" style="animation-delay:4.5s"/>
  <path d="M718 63V51M730 63V41M742 63V33" fill="none" class="indigo-s ic" stroke-width="3.5" stroke-linecap="round" style="animation-delay:4.5s"/>
  <text x="714" y="96" font-size="18.5" font-weight="600" letter-spacing="-0.3" class="fg">Measurable</text>
  <text x="714" y="120" font-size="13" class="mut">Every run logs savings.</text>
  <text x="714" y="139" font-size="13" class="mut">ROI visible from day one.</text>
  <line x1="714" y1="166" x2="880" y2="166" class="bd"/>
  <line x1="714" y1="166" x2="880" y2="166" class="indigo-s bar" stroke-width="2" stroke-linecap="round" style="animation-delay:4.5s"/>
</svg>
