<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" role="img" aria-label="Support ticket agent sequence">
  <defs>
    <marker id="afa-seq-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 z" fill="#818CF8"/>
    </marker>
    <marker id="afa-seq-ar-cy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 z" fill="#22D3EE"/>
    </marker>
  </defs>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
  .fg { fill: #F1F5F9; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #94A3B8; stroke-opacity: 0.28; stroke-width: 1.25; }
  .ln { stroke: #94A3B8; stroke-opacity: 0.22; }
  .indigo { fill: #818CF8; }
  .indigo-s { stroke: #818CF8; }
  .cyan { fill: #22D3EE; }
  .cyan-s { stroke: #22D3EE; }
  .emerald { fill: #34D399; }
  .emerald-s { stroke: #34D399; }
  .g1 { stop-color: #F1F5F9; }
  .g2 { stop-color: #818CF8; }
  .g3 { stop-color: #22D3EE; }
  .g4 { stop-color: #34D399; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .bd { stroke: #0F172A; stroke-opacity: 0.18; }
    .ln { stroke: #0F172A; stroke-opacity: 0.18; }
    .indigo { fill: #4F46E5; }
    .indigo-s { stroke: #4F46E5; }
    .cyan { fill: #0891B2; }
    .cyan-s { stroke: #0891B2; }
    .emerald { fill: #059669; }
    .emerald-s { stroke: #059669; }
    .g1 { stop-color: #0F172A; }
    .g2 { stop-color: #6366F1; }
    .g3 { stop-color: #06B6D4; }
    .g4 { stop-color: #10B981; }
  }
  
  .step { opacity: 0; animation: afa-sh 14s infinite both; }
  @keyframes afa-sh {
    0% { opacity: 0; transform: translateY(5px); }
    5% { opacity: 1; transform: translateY(0); }
    88% { opacity: 1; }
    95% { opacity: 0; }
    100% { opacity: 0; }
  }
  .pulse { animation: afa-pl 3.5s ease-in-out infinite; }
  @keyframes afa-pl { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <line x1="120" y1="60" x2="120" y2="412" class="ln" stroke-dasharray="3 6"/>
  <line x1="340" y1="60" x2="340" y2="412" class="ln" stroke-dasharray="3 6"/>
  <line x1="560" y1="60" x2="560" y2="412" class="ln" stroke-dasharray="3 6"/>
  <line x1="780" y1="60" x2="780" y2="412" class="ln" stroke-dasharray="3 6"/>

  <rect x="35" y="16" width="170" height="44" rx="12" class="bd"/>
  <text x="120" y="44" text-anchor="middle" font-size="16" font-weight="600" class="fg">Jira</text>
  <rect x="255" y="16" width="170" height="44" rx="12" class="bd"/>
  <text x="340" y="44" text-anchor="middle" font-size="16" font-weight="600" class="fg">AFA server</text>
  <rect x="475" y="16" width="170" height="44" rx="12" class="bd"/>
  <text x="560" y="44" text-anchor="middle" font-size="16" font-weight="600" class="fg">LLM classifier</text>
  <rect x="695" y="16" width="170" height="44" rx="12" class="bd"/>
  <text x="780" y="44" text-anchor="middle" font-size="16" font-weight="600" class="fg">GitHub</text>

  <g class="step" style="animation-delay:0s">
    <line x1="120" y1="112" x2="332" y2="112" class="indigo-s" stroke-width="2" marker-end="url(#afa-seq-ar)"/>
    <text x="230" y="100" text-anchor="middle" font-size="14" font-weight="500" class="fg">Webhook: SQ-123</text>
  </g>
  <g class="step" style="animation-delay:1.5s">
    <line x1="340" y1="166" x2="552" y2="166" class="cyan-s" stroke-width="2" marker-end="url(#afa-seq-ar-cy)"/>
    <text x="450" y="154" text-anchor="middle" font-size="14" font-weight="500" class="fg">Classify ticket</text>
  </g>
  <g class="step" style="animation-delay:3s">
    <line x1="560" y1="220" x2="348" y2="220" class="cyan-s" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#afa-seq-ar-cy)"/>
    <text x="450" y="208" text-anchor="middle" font-size="14" font-weight="500" class="fg">Genie onboarding</text>
  </g>
  <g class="step" style="animation-delay:4.5s">
    <line x1="340" y1="274" x2="772" y2="274" class="indigo-s" stroke-width="2" marker-end="url(#afa-seq-ar)"/>
    <text x="560" y="262" text-anchor="middle" font-size="14" font-weight="500" class="fg">Open PR with Terraform change</text>
  </g>
  <g class="step" style="animation-delay:6s">
    <line x1="340" y1="328" x2="128" y2="328" class="indigo-s" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#afa-seq-ar)"/>
    <text x="230" y="316" text-anchor="middle" font-size="14" font-weight="500" class="fg">PR link and notification</text>
  </g>
  <g class="step" style="animation-delay:7.5s">
    <rect x="650" y="368" width="232" height="40" rx="12" fill="none" class="emerald-s pulse" stroke-width="1.8"/>
    <text x="766" y="393" text-anchor="middle" font-size="14" font-weight="600" class="emerald">Human reviews and merges</text>
  </g>
</svg>
