<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".4" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aab6ff"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="300" rx="28"/></clipPath>

</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.dash{stroke-dasharray:6 8;animation:fl 1.2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-14}}
.pulse{animation:pl 4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:.6}}

</style>
<g clip-path="url(#clip)">
<rect width="1200" height="300" fill="#06070b"/>
<g filter="url(#blur)"><circle cx="200" cy="40" r="110" fill="#5b5bf0" opacity=".25"/><circle cx="1000" cy="270" r="120" fill="#06b6d4" opacity=".22"/></g><circle class="pulse" cx="160.0" cy="80" r="46" fill="#8ea2ff" filter="url(#glow)" style="animation-delay:0.0s"/><rect x="68" y="70" width="184" height="160" rx="22" fill="url(#glass)" stroke="url(#rim)"/><rect x="138.0" y="70" width="44" height="2.5" rx="1.25" fill="#8ea2ff"/><text x="90" y="114" font-size="14" fill="#8ea2ff" font-weight="600">Trigger</text><text x="90" y="154" font-size="19" fill="#f4f6ff" font-weight="600" letter-spacing="-.3">Event comes in</text><text x="90" y="182" font-size="13" fill="#8b94aa">Webhook, CLI or schedule</text><line class="dash" x1="256" y1="150.0" x2="284" y2="150.0" stroke="#9aa8ff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/><circle class="pulse" cx="380.0" cy="80" r="46" fill="#a78bfa" filter="url(#glow)" style="animation-delay:0.6s"/><rect x="288" y="70" width="184" height="160" rx="22" fill="url(#glass)" stroke="url(#rim)"/><rect x="358.0" y="70" width="44" height="2.5" rx="1.25" fill="#a78bfa"/><text x="310" y="114" font-size="14" fill="#a78bfa" font-weight="600">Registry</text><text x="310" y="154" font-size="19" fill="#f4f6ff" font-weight="600" letter-spacing="-.3">Finds the agent</text><text x="310" y="182" font-size="13" fill="#8b94aa">Reads every agent.yaml</text><line class="dash" x1="476" y1="150.0" x2="504" y2="150.0" stroke="#9aa8ff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/><circle class="pulse" cx="600.0" cy="80" r="46" fill="#34d399" filter="url(#glow)" style="animation-delay:1.2s"/><rect x="508" y="70" width="184" height="160" rx="22" fill="url(#glass)" stroke="url(#rim)"/><rect x="578.0" y="70" width="44" height="2.5" rx="1.25" fill="#34d399"/><text x="530" y="114" font-size="14" fill="#34d399" font-weight="600">Agent module</text><text x="530" y="154" font-size="19" fill="#f4f6ff" font-weight="600" letter-spacing="-.3">Does the work</text><text x="530" y="182" font-size="13" fill="#8b94aa">Classify, decide, act</text><line class="dash" x1="696" y1="150.0" x2="724" y2="150.0" stroke="#9aa8ff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/><circle class="pulse" cx="820.0" cy="80" r="46" fill="#22d3ee" filter="url(#glow)" style="animation-delay:1.7999999999999998s"/><rect x="728" y="70" width="184" height="160" rx="22" fill="url(#glass)" stroke="url(#rim)"/><rect x="798.0" y="70" width="44" height="2.5" rx="1.25" fill="#22d3ee"/><text x="750" y="114" font-size="14" fill="#22d3ee" font-weight="600">Integrations</text><text x="750" y="154" font-size="19" fill="#f4f6ff" font-weight="600" letter-spacing="-.3">Shared building blocks</text><text x="750" y="182" font-size="13" fill="#8b94aa">Jira, GitHub, LLM, Slack</text><line class="dash" x1="916" y1="150.0" x2="944" y2="150.0" stroke="#9aa8ff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/><circle class="pulse" cx="1040.0" cy="80" r="46" fill="#fbbf24" filter="url(#glow)" style="animation-delay:2.4s"/><rect x="948" y="70" width="184" height="160" rx="22" fill="url(#glass)" stroke="url(#rim)"/><rect x="1018.0" y="70" width="44" height="2.5" rx="1.25" fill="#fbbf24"/><text x="970" y="114" font-size="14" fill="#fbbf24" font-weight="600">Result</text><text x="970" y="154" font-size="19" fill="#f4f6ff" font-weight="600" letter-spacing="-.3">Work delivered</text><text x="970" y="182" font-size="13" fill="#8b94aa">PR, update, notification</text><path id="route" d="M68 150.0 H1132" fill="none"/>
<circle r="7" fill="#fff" filter="url(#soft)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
<circle r="16" fill="#8ea2ff" opacity=".45" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
<rect x=".5" y=".5" width="1199" height="299" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>