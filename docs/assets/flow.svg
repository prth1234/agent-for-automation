<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 198" width="900" height="198" role="img" aria-label="Execution flow">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
  .fg { fill: #F1F5F9; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #94A3B8; stroke-opacity: 0.25; stroke-width: 1.25; }
  .ln { stroke: #94A3B8; stroke-opacity: 0.22; }
  .indigo { fill: #818CF8; }
  .indigo-s { stroke: #818CF8; }
  .cyan { fill: #22D3EE; }
  .cyan-s { stroke: #22D3EE; }
  .emerald { fill: #34D399; }
  .emerald-s { stroke: #34D399; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .bd { stroke: #0F172A; stroke-opacity: 0.18; }
    .ln { stroke: #0F172A; stroke-opacity: 0.18; }
    .indigo { fill: #4F46E5; }
    .indigo-s { stroke: #4F46E5; }
    .cyan { fill: #0891B2; }
    .cyan-s { stroke: #0891B2; }
    .emerald { fill: #059669; }
    .emerald-s { stroke: #059669; }
  }

  .dash { stroke-dasharray: 5 6; animation: afa-fl 1.1s linear infinite; }
  @keyframes afa-fl { to { stroke-dashoffset: -11; } }

  /* 10s synchronized loop across 5 nodes */
  .n1 { animation: afa-n1 10s ease-in-out infinite; }
  @keyframes afa-n1 {
    0%, 18% { stroke-opacity: 1; stroke-width: 2.3; }
    24%, 100% { stroke-opacity: 0.28; stroke-width: 1.25; }
  }
  .n2 { animation: afa-n2 10s ease-in-out infinite; }
  @keyframes afa-n2 {
    0%, 18% { stroke-opacity: 0.28; stroke-width: 1.25; }
    20%, 38% { stroke-opacity: 1; stroke-width: 2.3; }
    44%, 100% { stroke-opacity: 0.28; stroke-width: 1.25; }
  }
  .n3 { animation: afa-n3 10s ease-in-out infinite; }
  @keyframes afa-n3 {
    0%, 38% { stroke-opacity: 0.28; stroke-width: 1.25; }
    40%, 58% { stroke-opacity: 1; stroke-width: 2.3; }
    64%, 100% { stroke-opacity: 0.28; stroke-width: 1.25; }
  }
  .n4 { animation: afa-n4 10s ease-in-out infinite; }
  @keyframes afa-n4 {
    0%, 58% { stroke-opacity: 0.28; stroke-width: 1.25; }
    60%, 78% { stroke-opacity: 1; stroke-width: 2.3; }
    84%, 100% { stroke-opacity: 0.28; stroke-width: 1.25; }
  }
  .n5 { animation: afa-n5 10s ease-in-out infinite; }
  @keyframes afa-n5 {
    0%, 78% { stroke-opacity: 0.28; stroke-width: 1.25; }
    80%, 98% { stroke-opacity: 1; stroke-width: 2.3; }
    100% { stroke-opacity: 0.28; stroke-width: 1.25; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  <path id="afa-flow-track" d="M 81 172 L 820 172" fill="none" stroke="none"/>

  <rect x="4" y="20" width="154" height="122" rx="12" fill="none" class="indigo-s n1"/>
  <text x="22" y="54" font-size="13" font-weight="600" class="indigo">Trigger</text>
  <text x="22" y="88" font-size="17.5" font-weight="600" letter-spacing="-0.3" class="fg">Event in</text>
  <text x="22" y="114" font-size="12.5" class="mut">Webhook, CLI, cron</text>

  <line class="dash indigo-s" x1="163" y1="81" x2="184" y2="81" stroke-width="2" stroke-linecap="round"/>

  <rect x="189" y="20" width="154" height="122" rx="12" fill="none" class="cyan-s n2"/>
  <text x="207" y="54" font-size="13" font-weight="600" class="cyan">Registry</text>
  <text x="207" y="88" font-size="17.5" font-weight="600" letter-spacing="-0.3" class="fg">Find the agent</text>
  <text x="207" y="114" font-size="12.5" class="mut">Reads agent.yaml</text>

  <line class="dash cyan-s" x1="348" y1="81" x2="369" y2="81" stroke-width="2" stroke-linecap="round"/>

  <rect x="374" y="20" width="154" height="122" rx="12" fill="none" class="emerald-s n3"/>
  <text x="392" y="54" font-size="13" font-weight="600" class="emerald">Agent</text>
  <text x="392" y="88" font-size="17.5" font-weight="600" letter-spacing="-0.3" class="fg">Do the work</text>
  <text x="392" y="114" font-size="12.5" class="mut">Classify and act</text>

  <line class="dash emerald-s" x1="533" y1="81" x2="554" y2="81" stroke-width="2" stroke-linecap="round"/>

  <rect x="559" y="20" width="154" height="122" rx="12" fill="none" class="cyan-s n4"/>
  <text x="577" y="54" font-size="13" font-weight="600" class="cyan">Integrations</text>
  <text x="577" y="88" font-size="17.5" font-weight="600" letter-spacing="-0.3" class="fg">Shared tools</text>
  <text x="577" y="114" font-size="12.5" class="mut">Jira, GitHub, LLM</text>

  <line class="dash indigo-s" x1="718" y1="81" x2="739" y2="81" stroke-width="2" stroke-linecap="round"/>

  <rect x="744" y="20" width="152" height="122" rx="12" fill="none" class="emerald-s n5"/>
  <text x="762" y="54" font-size="13" font-weight="600" class="emerald">Result</text>
  <text x="762" y="88" font-size="17.5" font-weight="600" letter-spacing="-0.3" class="fg">Delivered</text>
  <text x="762" y="114" font-size="12.5" class="mut">PR, update, alert</text>

  <!-- Synchronized signal bus -->
  <line x1="81" y1="172" x2="820" y2="172" class="ln" stroke-dasharray="2 6"/>
  <circle cx="81" cy="172" r="3" class="indigo"/>
  <circle cx="266" cy="172" r="3" class="cyan"/>
  <circle cx="451" cy="172" r="3" class="emerald"/>
  <circle cx="636" cy="172" r="3" class="cyan"/>
  <circle cx="820" cy="172" r="3" class="emerald"/>
  <circle r="5" class="cyan">
    <animateMotion dur="10s" repeatCount="indefinite">
      <mpath href="#afa-flow-track"/>
    </animateMotion>
  </circle>
</svg>
