<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".4" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aab6ff"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="420" rx="28"/></clipPath>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#6366f1" stop-opacity="0"/><stop offset=".5" stop-color="#9aa8ff"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.o1{animation:d1 16s ease-in-out infinite alternate}
.o2{animation:d2 19s ease-in-out infinite alternate}
.o3{animation:d3 22s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(260px,50px)}}
@keyframes d2{to{transform:translate(-300px,-40px)}}
@keyframes d3{to{transform:translate(-180px,90px)}}
.tl{opacity:0;animation:tl 12s infinite both}
@keyframes tl{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.sweep{animation:sw 7s ease-in-out infinite}
@keyframes sw{0%,100%{opacity:.35}50%{opacity:1}}

</style>
<g clip-path="url(#clip)">
<rect width="1200" height="420" fill="#06070b"/>

<g filter="url(#blur)">
<circle class="o1" cx="180" cy="110" r="170" fill="#5b5bf0" opacity=".6"/>
<circle class="o2" cx="1010" cy="340" r="190" fill="#06b6d4" opacity=".42"/>
<circle class="o3" cx="840" cy="40" r="140" fill="#c026d3" opacity=".38"/>
</g>
<rect x="80" y="1" width="1040" height="2" fill="url(#edge)" class="sweep"/>
<text x="600" y="168" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="-2.5" fill="url(#ttl)">Agents for Automation</text>
<text x="600" y="224" text-anchor="middle" font-size="24" fill="#9aa3b8" font-weight="400">A marketplace of plug-and-play workflow agents</text>
<text class="tl" style="animation-delay:0s" x="600" y="296" text-anchor="middle" font-size="24" fill="#8ea2ff" font-weight="500">Triage tickets automatically</text><text class="tl" style="animation-delay:3s" x="600" y="296" text-anchor="middle" font-size="24" fill="#8ea2ff" font-weight="500">Open pull requests while you sleep</text><text class="tl" style="animation-delay:6s" x="600" y="296" text-anchor="middle" font-size="24" fill="#8ea2ff" font-weight="500">Install an agent in one command</text><text class="tl" style="animation-delay:9s" x="600" y="296" text-anchor="middle" font-size="24" fill="#8ea2ff" font-weight="500">Build once. Reuse everywhere.</text>
<rect x="337.0" y="338" width="120" height="34" rx="17" fill="url(#glass)" stroke="url(#rim)"/><text x="397.0" y="360" text-anchor="middle" font-size="14" fill="#c9d1e6" font-weight="500">Python 3.11+</text><rect x="473.0" y="338" width="100" height="34" rx="17" fill="url(#glass)" stroke="url(#rim)"/><text x="523.0" y="360" text-anchor="middle" font-size="14" fill="#c9d1e6" font-weight="500">FastAPI</text><rect x="589.0" y="338" width="132" height="34" rx="17" fill="url(#glass)" stroke="url(#rim)"/><text x="655.0" y="360" text-anchor="middle" font-size="14" fill="#c9d1e6" font-weight="500">AWS Bedrock</text><rect x="737.0" y="338" width="126" height="34" rx="17" fill="url(#glass)" stroke="url(#rim)"/><text x="800.0" y="360" text-anchor="middle" font-size="14" fill="#c9d1e6" font-weight="500">MIT License</text>

<rect x=".5" y=".5" width="1199" height="419" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>