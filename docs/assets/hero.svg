<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 265" width="900" height="265" role="img" aria-label="Agents for Automation">
  <defs>
    <linearGradient id="afa-hero-ttl" x1="0" x2="1">
      <stop class="g1" offset="0"/>
      <stop class="g2" offset="0.45"/>
      <stop class="g3" offset="0.78"/>
      <stop class="g4" offset="1"/>
    </linearGradient>
    <linearGradient id="afa-hero-rule" x1="0" x2="1">
      <stop class="g2" offset="0" stop-opacity="0"/>
      <stop class="g2" offset="0.35"/>
      <stop class="g3" offset="0.65"/>
      <stop class="g4" offset="1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
  .fg { fill: #F1F5F9; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #94A3B8; stroke-opacity: 0.28; stroke-width: 1.25; }
  .ln { stroke: #94A3B8; stroke-opacity: 0.22; }
  .indigo { fill: #818CF8; }
  .indigo-s { stroke: #818CF8; }
  .cyan { fill: #22D3EE; }
  .cyan-s { stroke: #22D3EE; }
  .emerald { fill: #34D399; }
  .emerald-s { stroke: #34D399; }
  .g1 { stop-color: #F1F5F9; }
  .g2 { stop-color: #818CF8; }
  .g3 { stop-color: #22D3EE; }
  .g4 { stop-color: #34D399; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .bd { stroke: #0F172A; stroke-opacity: 0.18; }
    .ln { stroke: #0F172A; stroke-opacity: 0.18; }
    .indigo { fill: #4F46E5; }
    .indigo-s { stroke: #4F46E5; }
    .cyan { fill: #0891B2; }
    .cyan-s { stroke: #0891B2; }
    .emerald { fill: #059669; }
    .emerald-s { stroke: #059669; }
    .g1 { stop-color: #0F172A; }
    .g2 { stop-color: #6366F1; }
    .g3 { stop-color: #06B6D4; }
    .g4 { stop-color: #10B981; }
  }
  
  .tl { opacity: 0; animation: afa-tl 12s infinite both; }
  @keyframes afa-tl {
    0% { opacity: 0; transform: translateY(6px); }
    5% { opacity: 1; transform: translateY(0); }
    22% { opacity: 1; transform: translateY(0); }
    27% { opacity: 0; transform: translateY(-6px); }
    100% { opacity: 0; }
  }
  .sw { animation: afa-sw 5s ease-in-out infinite; }
  @keyframes afa-sw { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <text x="450" y="88" text-anchor="middle" font-size="56" font-weight="700" letter-spacing="-1.8" fill="url(#afa-hero-ttl)">Agents for Automation</text>
  <text x="450" y="128" text-anchor="middle" font-size="19" class="mut">A marketplace of plug-and-play workflow agents</text>
  <rect x="150" y="148" width="600" height="2" rx="1" fill="url(#afa-hero-rule)" class="sw"/>
  <text class="tl indigo" style="animation-delay:0s" x="450" y="182" text-anchor="middle" font-size="19" font-weight="500">Triage tickets automatically</text>
  <text class="tl cyan" style="animation-delay:3s" x="450" y="182" text-anchor="middle" font-size="19" font-weight="500">Open pull requests while you sleep</text>
  <text class="tl emerald" style="animation-delay:6s" x="450" y="182" text-anchor="middle" font-size="19" font-weight="500">Install an agent in one command</text>
  <text class="tl indigo" style="animation-delay:9s" x="450" y="182" text-anchor="middle" font-size="19" font-weight="500">Build once. Reuse everywhere.</text>
  <rect x="197" y="212" width="118" height="32" rx="16" class="bd"/>
  <text x="256" y="233" text-anchor="middle" font-size="13" font-weight="500" class="mut">Python 3.11+</text>
  <rect x="329" y="212" width="96" height="32" rx="16" class="bd"/>
  <text x="377" y="233" text-anchor="middle" font-size="13" font-weight="500" class="mut">FastAPI</text>
  <rect x="439" y="212" width="128" height="32" rx="16" class="bd"/>
  <text x="503" y="233" text-anchor="middle" font-size="13" font-weight="500" class="mut">AWS Bedrock</text>
  <rect x="581" y="212" width="122" height="32" rx="16" class="bd"/>
  <text x="642" y="233" text-anchor="middle" font-size="13" font-weight="500" class="mut">MIT License</text>
</svg>
