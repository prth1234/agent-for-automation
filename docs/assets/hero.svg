<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" width="900" height="286" role="img" aria-label="Agents for Automation">
  <defs>
    <linearGradient id="afa-hero-ttl" x1="0" x2="1">
      <stop class="g1" offset="0"/>
      <stop class="g2" offset="0.45"/>
      <stop class="g3" offset="0.78"/>
      <stop class="g4" offset="1"/>
    </linearGradient>
    <linearGradient id="afa-hero-rule" x1="0" x2="1">
      <stop class="g2" offset="0" stop-opacity="0"/>
      <stop class="g2" offset="0.35"/>
      <stop class="g3" offset="0.65"/>
      <stop class="g4" offset="1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .m { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
  .fg { fill: #F1F5F9; }
  .mut { fill: #94A3B8; }
  .bd { fill: none; stroke: #94A3B8; stroke-opacity: 0.28; stroke-width: 1.25; }
  .indigo { fill: #818CF8; }
  .indigo-s { stroke: #818CF8; }
  .cyan { fill: #22D3EE; }
  .cyan-s { stroke: #22D3EE; }
  .emerald { fill: #34D399; }
  .emerald-s { stroke: #34D399; }
  .g1 { stop-color: #F1F5F9; }
  .g2 { stop-color: #818CF8; }
  .g3 { stop-color: #22D3EE; }
  .g4 { stop-color: #34D399; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .bd { stroke: #0F172A; stroke-opacity: 0.18; }
    .indigo { fill: #4F46E5; }
    .indigo-s { stroke: #4F46E5; }
    .cyan { fill: #0891B2; }
    .cyan-s { stroke: #0891B2; }
    .emerald { fill: #059669; }
    .emerald-s { stroke: #059669; }
    .g1 { stop-color: #0F172A; }
    .g2 { stop-color: #6366F1; }
    .g3 { stop-color: #06B6D4; }
    .g4 { stop-color: #10B981; }
  }

  .dot-ping { animation: afa-ping 2.2s ease-out infinite; transform-origin: 318px 34px; }
  @keyframes afa-ping {
    0% { r: 4; opacity: 0.9; }
    70% { r: 10; opacity: 0; }
    100% { r: 10; opacity: 0; }
  }
  .cur { animation: afa-cur 1.1s steps(2, start) infinite; }
  @keyframes afa-cur { to { opacity: 0; } }

  .tl { opacity: 0; animation: afa-tl 12s infinite both; }
  @keyframes afa-tl {
    0% { opacity: 0; transform: translateY(6px); }
    5% { opacity: 1; transform: translateY(0); }
    22% { opacity: 1; transform: translateY(0); }
    27% { opacity: 0; transform: translateY(-6px); }
    100% { opacity: 0; }
  }

  .trace { stroke-dasharray: 10 8; animation: afa-tr 2.4s linear infinite; }
  @keyframes afa-tr { to { stroke-dashoffset: -36; } }

  .pill { animation: afa-pill 4s ease-in-out infinite; }
  @keyframes afa-pill {
    0%, 100% { stroke-opacity: 0.3; stroke-width: 1.25; }
    20% { stroke-opacity: 1; stroke-width: 2.1; }
    45% { stroke-opacity: 0.3; stroke-width: 1.25; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .tl-first { opacity: 1 !important; }
  }
</style>

  <!-- Live Status Header -->
  <circle cx="318" cy="34" r="4" class="emerald"/>
  <circle cx="318" cy="34" r="4" fill="none" class="emerald-s dot-ping" stroke-width="1.5"/>
  <text x="332" y="39" font-size="13" font-weight="600" letter-spacing="2" class="m cyan">ACTIVE // AGENT PLATFORM</text>
  <text x="572" y="39" font-size="14" font-weight="700" class="m emerald cur">_</text>

  <!-- Title & Subtitle -->
  <text x="450" y="96" text-anchor="middle" font-size="56" font-weight="700" letter-spacing="-1.8" fill="url(#afa-hero-ttl)">Agents for Automation</text>
  <text x="450" y="134" text-anchor="middle" font-size="18.5" class="mut">A marketplace of plug-and-play workflow agents</text>

  <!-- Animated Circuit Trace + Travelling Signal Dot -->
  <path id="afa-hero-trace" d="M 150 162 L 320 162 L 336 152 L 564 152 L 580 162 L 750 162" fill="none" stroke="url(#afa-hero-rule)" class="trace" stroke-width="2" stroke-linecap="round"/>
  <circle r="4.5" class="cyan">
    <animateMotion dur="3.6s" repeatCount="indefinite">
      <mpath href="#afa-hero-trace"/>
    </animateMotion>
  </circle>

  <!-- Cycling Taglines -->
  <text class="tl tl-first indigo" style="animation-delay:0s" x="450" y="196" text-anchor="middle" font-size="18.5" font-weight="500">Triage tickets automatically</text>
  <text class="tl cyan" style="animation-delay:3s" x="450" y="196" text-anchor="middle" font-size="18.5" font-weight="500">Open pull requests while you sleep</text>
  <text class="tl emerald" style="animation-delay:6s" x="450" y="196" text-anchor="middle" font-size="18.5" font-weight="500">Install an agent in one command</text>
  <text class="tl indigo" style="animation-delay:9s" x="450" y="196" text-anchor="middle" font-size="18.5" font-weight="500">Build once. Reuse everywhere.</text>

  <!-- Sequential Highlight Pills -->
  <rect x="197" y="226" width="118" height="34" rx="17" fill="none" class="indigo-s pill" style="animation-delay:0s"/>
  <text x="256" y="248" text-anchor="middle" font-size="13" font-weight="600" class="m indigo">Python 3.11+</text>

  <rect x="329" y="226" width="96" height="34" rx="17" fill="none" class="cyan-s pill" style="animation-delay:1s"/>
  <text x="377" y="248" text-anchor="middle" font-size="13" font-weight="600" class="m cyan">FastAPI</text>

  <rect x="439" y="226" width="128" height="34" rx="17" fill="none" class="emerald-s pill" style="animation-delay:2s"/>
  <text x="503" y="248" text-anchor="middle" font-size="13" font-weight="600" class="m emerald">AWS Bedrock</text>

  <rect x="581" y="226" width="122" height="34" rx="17" fill="none" class="indigo-s pill" style="animation-delay:3s"/>
  <text x="642" y="248" text-anchor="middle" font-size="13" font-weight="600" class="m mut">MIT License</text>
</svg>
