name: Support Ticket Automation

on:
  repository_dispatch:
    types: [jira-support-ticket]
  workflow_dispatch:
    inputs:
      ticket_key:
        description: "Jira ticket key (e.g. SQ-32775)"
        required: true
        type: string
      live:
        description: "Run in live mode (create PR, comment on Jira, send SES email)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  process-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agents-for-automation
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Run support ticket workflow
        env:
          DRY_RUN: ${{ inputs.live == true && 'false' || (github.event_name == 'repository_dispatch' && 'false' || 'true') }}
          WORKSPACES_ROOT: ${{ github.workspace }}/repos
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://flexera.atlassian.net' }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          SES_REGION: us-east-1
          SES_SENDER_EMAIL: ${{ vars.SES_SENDER_EMAIL }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIVE_FLAG=""
            if [ "${{ inputs.live }}" = "true" ]; then
              LIVE_FLAG="--live"
            fi
            uv run afa run-ticket "${{ inputs.ticket_key }}" $LIVE_FLAG
          else
            echo '${{ toJson(github.event.client_payload) }}' > /tmp/ticket.json
            uv run afa run-json /tmp/ticket.json --live
          fi
