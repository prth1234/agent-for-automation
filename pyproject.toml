[project]
name = "agents-for-automation"
version = "0.1.0"
description = "Modular agentic automation platform for Thorium team workflows"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "botocore[crt]>=1.35.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-aws>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
afa = "agents_for_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_for_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
